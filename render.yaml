# Render Blueprint: one free PostgreSQL database + one Node web service.
# Render → New → Blueprint → pick this repo → Apply. You'll be asked for NVIDIA_API_KEY.
databases:
  - name: campusfest-db
    plan: free
    databaseName: campusfest
    user: campusfest

services:
  - type: web
    name: campusfest-growth-center
    runtime: node
    plan: free
    rootDir: app
    buildCommand: npm ci --include=dev && npm run build
    # Seeds the original RISA dataset only when the database is empty, so edits survive restarts
    startCommand: npm run db:init && npm run start
    healthCheckPath: /api/settings
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campusfest-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3.5-super-vl-120b-a12b
      - key: NVIDIA_FALLBACK_MODELS
        value: nvidia/nemotron-3.5-lightning-30b-a3b,mistralai/mistral-large-4-1t-a52b
